<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refugio</title>
<meta name="theme-color" content="#111613">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Refugio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root {
  --bg: #e4e7df;
  --surface: #edefe8;
  --ink: #1d2620;
  --muted: #5b685f;
  --line: #ccd2c6;
  --green: #3d6350;
  --green-ink: #eef2ea;
  --sun: #a8793a;
  --sun-soft: #e3d5b6;
  --danger: #8f4b3d;
  --overlay: rgba(20, 26, 22, .6);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --ink: #dde3da; --muted: #8b998f; --line: #28332c;
    --green: #6b9780; --green-ink: #0e1511; --sun: #b38a52; --sun-soft: #2b2518; --danger: #c27c6c;
    --overlay: rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --ink: #dde3da; --muted: #8b998f; --line: #28332c;
  --green: #6b9780; --green-ink: #0e1511; --sun: #b38a52; --sun-soft: #2b2518; --danger: #c27c6c;
  --overlay: rgba(0, 0, 0, .7); color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: transparent; color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
.app { max-width: 520px; margin: 0 auto; padding: 20px 18px 96px; }
header.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
header.top h1 { font-size: 26px; font-weight: 800; }
header.top p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.tools { display: flex; gap: 6px; flex-shrink: 0; }
.iconbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }

.hello { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; margin: 14px 0 0; text-align: center; }

.sunwrap { position: relative; margin: 6px auto 0; max-width: 360px; }
.sunwrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.track { stroke: var(--line); }
.prog { stroke: var(--sun); transition: stroke-dashoffset .9s ease; }
.sundot { fill: var(--sun); }
.sunglow { fill: var(--sun-soft); }
.count { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.count .n { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 800; font-size: 76px; line-height: 1; }
.count .l { color: var(--muted); font-size: 16px; margin-top: 2px; }
.goalline { text-align: center; color: var(--muted); margin: 10px 0 0; font-size: 15px; }

.week { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); }
.dot.ok { background: var(--green); border-color: var(--green); }
.dot.fail { border-color: var(--danger); position: relative; }
.dot.fail::after { content: ""; position: absolute; inset: 6px 4px; border-top: 2px solid var(--danger); }

.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 18px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; }
.stat span { font-size: 13px; color: var(--muted); }

.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 16px; font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
.btn.primary { background: var(--green); color: var(--green-ink); }
.btn.sun { background: var(--sun); color: #16110a; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; font-size: 16px; padding: 12px; }
.btn + .btn { margin-top: 10px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.verse { margin: 22px 0 0; padding: 14px 16px; border-left: 4px solid var(--sun); background: var(--surface); border-radius: 0 12px 12px 0; }
.verse p { margin: 0; }
.verse small { display: block; color: var(--muted); margin-top: 6px; }
.verse button { background: none; border: 0; color: var(--green); font: inherit; font-size: 14px; padding: 8px 0 0; cursor: pointer; text-decoration: underline; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { display: flex; width: 100%; max-width: 520px; }
nav.tabs button { flex: 1; background: none; border: 0; padding: 14px 4px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-top-color: var(--sun); }

section.view { display: none; }
section.view.on { display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 20px; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
label.f { display: block; font-weight: 700; font-size: 15px; margin: 14px 0 6px; }
textarea, input[type=text], input[type=date], input[type=password], select { width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.row .btn { padding: 12px; font-size: 16px; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list li p { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
ul.list li time { display: block; font-size: 13px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
.empty { color: var(--muted); padding: 8px 0; }
.safe { display: flex; gap: 10px; align-items: flex-start; background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; }
.safe b { white-space: nowrap; }

.overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.on { display: flex; }
.overlay.lock { z-index: 40; align-items: center; background: var(--bg); }
.overlay.lock .sheet { border-radius: 22px; text-align: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 26px; margin-bottom: 6px; }
@media (prefers-reduced-motion: reduce) { .prog { transition: none; } }
.timer { text-align: center; font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 40px; font-weight: 800; }
.steps { margin: 14px 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }
.myreasons { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.myreasons p { margin: 0 0 6px; }
.myreasons p:last-child { margin: 0; }
.faithline { font-style: italic; }
.center { text-align: center; }
.small { font-size: 14px; color: var(--muted); }
.pin { text-align: center; letter-spacing: .5em; font-size: 28px; max-width: 220px; margin: 14px auto; display: block; }
.err { color: var(--danger); min-height: 1.4em; margin: 0; font-size: 15px; }
.moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; font: inherit; cursor: pointer; }
.mood[aria-pressed="true"] { background: var(--green); color: var(--green-ink); border-color: var(--green); font-weight: 700; }
.weekmood { display: flex; justify-content: center; align-items: flex-end; gap: 10px; height: 74px; margin: 16px 0 8px; }
.wm { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; font-size: 12px; color: var(--muted); height: 100%; }
.bar { width: 22px; border-radius: 6px; }
.bar.m3 { height: 44px; background: var(--green); }
.bar.m2 { height: 28px; background: var(--sun); }
.bar.m1 { height: 14px; background: var(--danger); }
.bar.m0 { height: 6px; background: var(--line); }
.pray details { border-top: 1px solid var(--line); padding: 12px 0; }
.pray details:first-child { border-top: 0; }
.pray summary { cursor: pointer; font-weight: 700; }
.pray .pbody { white-space: pre-wrap; margin-top: 10px; line-height: 1.7; }
nav.tabs button { font-size: 14px !important; padding: 14px 2px !important; }
.btnrow { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
.btnrow .btn { flex: 1; margin: 0; }
.info { flex: 0 0 52px; width: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 24px; cursor: pointer; }
.infobody p { margin: 0 0 12px; }
html { background: var(--bg); }
.f { display: block; font-weight: 700; font-size: 15px; margin: 14px 0 6px; }
a.btn { text-align: center; text-decoration: none; }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.logo { width: 42px; height: 42px; border-radius: 12px; overflow: hidden; flex: 0 0 42px; }
.logo img, .logo svg, .splashlogo img, .splashlogo svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.splashlogo { width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 22px; overflow: hidden; }
.overlay.splash { z-index: 35; align-items: center; background: var(--bg); }
.sheet.center { text-align: center; border-radius: 22px; padding: 28px 20px; }
.sheet.center p.big { font-size: 19px; margin: 0 0 10px; color: var(--ink); }
.sheet.full { height: 100%; max-height: 100%; border-radius: 0; }
.sethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.sethead h2 { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--green); color: var(--green-ink); border-color: var(--green); font-weight: 700; }
.dotc { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
.colrow { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
.clab { display: flex; flex-direction: column; gap: 6px; font-size: 15px; margin: 8px 0; }
input[type=color] { width: 64px; height: 44px; padding: 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
input[type=range] { width: 100%; accent-color: var(--green); }
.chk { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 16px; }
.chk input { width: 22px; height: 22px; accent-color: var(--green); }
.sr { position: absolute; left: -9999px; }
#wall { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; display: none; }
#wall::after { content: ""; position: absolute; inset: 0; background: rgba(var(--wallrgb, 0, 0, 0), var(--walldim, .5)); }
html.has-wall #wall { display: block; }
html.has-wall .card, html.has-wall .stat, html.has-wall .verse { background: color-mix(in srgb, var(--surface) 90%, transparent); }
.breathwrap { display: flex; justify-content: center; margin: 22px 0 18px; }
.breath { width: 160px; height: 160px; margin: 0; border-radius: 50%; background: var(--sun-soft); border: 3px solid var(--sun); display: flex; align-items: center; justify-content: center; text-align: center; transform: scale(.7); animation: none; }
.breath .bl { font-size: 20px; font-weight: 700; }
.breath .bc { font-size: 38px; font-weight: 800; line-height: 1.1; }
.verse p, .verse small { transition: opacity .35s ease; }
.verse.fade p, .verse.fade small { opacity: 0; }
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" id="logoBox"></div>
      <div>
        <h1>Refugio</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="tools">
      <button class="iconbtn" id="langBtn" type="button" aria-label="Cambiar idioma / Change language">English</button>
      <button class="iconbtn" id="settingsBtn" type="button" data-i18n="settingsBtn" data-i18n-aria="settingsAria"></button>
    </div>
  </header>

  <!-- HOY -->
  <section class="view on" id="v-hoy">
    <div id="welcome" class="card" hidden>
      <h2 data-i18n="wTitle"></h2>
      <p class="hint" data-i18n="wHint"></p>
      <div class="safe"><b data-i18n="wSafeB"></b><span data-i18n="wSafe"></span></div>

      <label class="f" for="nameIn" data-i18n="nameLbl"></label>
      <input type="text" id="nameIn" maxlength="30" autocomplete="off" data-i18n-ph="namePh">

      <label class="f" for="faithIn" data-i18n="faithLbl"></label>
      <select id="faithIn"></select>

      <label class="f" for="startDate" data-i18n="startLbl"></label>
      <input type="date" id="startDate">
      <p class="small" data-i18n="startNote"></p>

      <div class="row"><button class="btn primary" id="startBtn" type="button" data-i18n="startBtn"></button></div>
    </div>

    <div id="dash" hidden>
      <p class="hello" id="hello"></p>
      <div class="sunwrap">
        <svg viewBox="0 0 300 170" aria-hidden="true">
          <circle class="sunglow" id="glow" cx="150" cy="150" r="0" opacity=".7"/>
          <path class="track" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke-width="12" stroke-linecap="round"/>
          <path class="prog" id="prog" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke-width="12" stroke-linecap="round"/>
          <circle class="sundot" id="dot" cx="30" cy="150" r="13"/>
        </svg>
        <div class="count"><div class="n" id="days">0</div><div class="l" id="daysLbl"></div></div>
      </div>
      <p class="goalline" id="goalLine"></p>

      <div class="week" id="week"></div>

      <div class="stats">
        <div class="stat"><b id="best">0</b><span data-i18n="best"></span></div>
        <div class="stat"><b id="urges">0</b><span data-i18n="urges"></span></div>
        <div class="stat"><b id="relapses">0</b><span data-i18n="relapses"></span></div>
      </div>

      <div class="btnrow">
        <button class="btn sun" id="urgeBtn" type="button" data-i18n="urgeBtn"></button>
        <button class="info" type="button" data-info="urge" data-i18n-aria="infoUrgeAria">i</button>
      </div>
      <div class="btnrow">
        <button class="btn ghost" id="relapseBtn" type="button" data-i18n="relapseBtn"></button>
        <button class="info" type="button" data-info="rel" data-i18n-aria="infoRelAria">i</button>
      </div>

      <div class="card" id="moodCard" style="margin-top:18px">
        <h2 data-i18n="moodT"></h2>
        <p class="hint" id="moodHint" data-i18n="moodHint"></p>
        <div class="moods" role="group" data-i18n-aria="moodAria">
          <button class="mood" type="button" data-m="3" aria-pressed="false" data-i18n="moodGood"></button>
          <button class="mood" type="button" data-m="2" aria-pressed="false" data-i18n="moodOk"></button>
          <button class="mood" type="button" data-m="1" aria-pressed="false" data-i18n="moodHard"></button>
        </div>
        <div class="weekmood" id="weekMood"></div>
        <p class="small" id="moodSummary"></p>
      </div>

      <div class="card">
        <h2 data-i18n="dailyT"></h2>
        <p style="margin:0" id="dailyMsg"></p>
      </div>

      <div class="verse" id="verseBox">
        <p id="phraseText"></p>
        <small id="phraseRef"></small>
        <button type="button" id="phraseNext" data-i18n="phraseNext"></button>
      </div>
    </div>
  </section>

  <!-- RAZONES -->
  <section class="view" id="v-razones">
    <div class="card">
      <h2 data-i18n="reasonsT"></h2>
      <p class="hint" data-i18n="reasonsHint"></p>
      <p class="small" data-i18n="chipsLbl" style="margin:0 0 6px"></p>
      <div class="chips" id="reasonChips"></div>
      <textarea id="reasonIn" data-i18n-ph="reasonPh" data-i18n-aria="reasonAria"></textarea>
      <div class="row"><button class="btn primary" id="addReason" type="button" data-i18n="reasonSave"></button></div>
    </div>
    <div class="card" id="reasonNext" hidden>
      <h2 data-i18n="reasonNextT"></h2>
      <p class="hint" data-i18n="reasonNextTxt"></p>
      <button class="btn sun" id="goPlan" type="button" data-i18n="reasonNextBtn"></button>
    </div>
    <div class="card"><ul class="list" id="reasonList"></ul></div>
  </section>

  <!-- DIARIO -->
  <section class="view" id="v-diario">
    <div class="card">
      <h2 data-i18n="diaryT"></h2>
      <p class="hint" data-i18n="diaryHint"></p>
      <textarea id="noteIn" data-i18n-ph="notePh" data-i18n-aria="noteAria"></textarea>
      <div class="row"><button class="btn primary" id="addNote" type="button" data-i18n="noteSave"></button></div>
    </div>
    <div class="card"><ul class="list" id="noteList"></ul></div>
  </section>

  <!-- ORACIÓN / CALMA -->
  <section class="view" id="v-oracion">
    <div class="card">
      <h2 id="prayTitle"></h2>
      <p class="hint" id="prayHint"></p>
      <div class="pray" id="prayList"></div>
    </div>
  </section>

  <!-- PLAN -->
  <section class="view" id="v-plan">
    <div class="card" id="planCard">
      <h2 data-i18n="planPT"></h2>
      <p class="hint" data-i18n="planPHint"></p>
      <div class="f" data-i18n="planWhyL"></div>
      <div class="myreasons" id="planWhy"></div>
      <div class="f" data-i18n="planTrigL"></div>
      <div class="chips" id="planTrig"></div>
      <div class="f" data-i18n="planActL"></div>
      <div class="chips" id="planActs"></div>
      <label class="f" for="planName" data-i18n="planPersonL"></label>
      <input type="text" id="planName" maxlength="40" autocomplete="off" data-i18n-ph="planPersonNamePh">
      <input type="text" id="planPhone" inputmode="tel" maxlength="20" autocomplete="off" data-i18n-ph="planPhonePh" style="margin-top:8px">
      <label class="f" for="planPledge" data-i18n="planPledgeL"></label>
      <textarea id="planPledge" data-i18n-ph="planPledgePh"></textarea>
      <div class="row"><button class="btn primary" id="planSave" type="button" data-i18n="planSave"></button></div>
      <p class="small" id="planMsg" role="status"></p>
    </div>

    <div class="card">
      <h2 data-i18n="planT"></h2>
      <p class="hint" data-i18n="planHint"></p>
      <ul class="steps">
        <li><b data-i18n="plan1b"></b> <span data-i18n="plan1"></span></li>
        <li><b data-i18n="plan2b"></b> <span data-i18n="plan2"></span></li>
        <li><b data-i18n="plan3b"></b> <span data-i18n="plan3"></span></li>
        <li><b data-i18n="plan4b"></b> <span data-i18n="plan4"></span></li>
        <li><b data-i18n="plan5b"></b> <span id="supportTxt"></span></li>
        <li><b data-i18n="plan6b"></b> <span data-i18n="plan6"></span></li>
      </ul>
      <p class="small" data-i18n="planHelp"></p>
    </div>

  </section>
</div>

<nav class="tabs" data-i18n-aria="tabsAria">
  <div class="in" role="tablist">
    <button role="tab" aria-selected="true" data-v="hoy" type="button" data-i18n="tabHoy"></button>
    <button role="tab" aria-selected="false" data-v="razones" type="button" data-i18n="tabReasons"></button>
    <button role="tab" aria-selected="false" data-v="diario" type="button" data-i18n="tabDiary"></button>
    <button role="tab" aria-selected="false" data-v="oracion" type="button" id="tabPrayer"></button>
    <button role="tab" aria-selected="false" data-v="plan" type="button" data-i18n="tabPlan"></button>
  </div>
</nav>

<!-- MOMENTO DIFÍCIL -->
<div class="overlay" id="urgeOv" role="dialog" aria-modal="true" aria-labelledby="urgeTitle">
  <div class="sheet">

  $("themeDark").addEventListener("click", function () { setTheme("dark"); });
  $("themeLight").addEventListener("click", function () { setTheme("light"); });
  $("apAccent").addEventListener("input", function () { state.appear.accent = this.value; save(); applyAppearance(); });
  $("apDetail").addEventListener("input", function () { state.appear.detail = this.value; save(); applyAppearance(); });
  $("apReset").addEventListener("click", function () { state.appear.palette = "bosque"; state.appear.accent = ""; state.appear.detail = ""; save(); applyAppearance(); syncSettings(); });
  $("apDim").addEventListener("input", function () { state.appear.dim = +this.value; save(); applyAppearance(); });
  $("chkWelcome").addEventListener("change", function () { state.showWelcome = this.checked; save(); });
  $("chkVibe").addEventListener("change", function () { state.vibe = this.checked; save(); if (this.checked) buzz(30); });

  /* ---------- configuración ---------- */
  $("settingsBtn").addEventListener("click", function () { syncSettings(); $("setOv").classList.add("on"); });
  $("setClose").addEventListener("click", function () { $("setOv").classList.remove("on"); });

  /* ---------- bienvenida al abrir la app ---------- */
  function openSplash() {
    if (state.showWelcome === false) return;
    $("wsTitle").textContent = nm() ? t("wsTitleN", { n: nm() }) : t("wsTitle");
    $("wsMsg").textContent = t("wsMsg"); $("wsMsg2").textContent = t("wsMsg2");
    var vb = $("wsVerse"); vb.innerHTML = "";
    var list = FAITHS[state.faith].phrases, p = list[((verseIdx() % list.length) + list.length) % list.length][state.lang];
    var vp = document.createElement("p"); vp.className = "faithline"; vp.textContent = withName(p[0]); vb.appendChild(vp);
    if (p[1]) { var rp = document.createElement("p"); rp.className = "small"; rp.textContent = p[1]; vb.appendChild(rp); }
    $("welcomeOv").classList.add("on");
  }
  $("wsGo").addEventListener("click", function () { $("welcomeOv").classList.remove("on"); window.scrollTo(0, 0); });

  /* ---------- cambio automático de versículos y mensajes ---------- */
  function fillRot() {
    var sel = $("setRot"); sel.innerHTML = "";
    [["open", "rotOpen"], ["minute", "rotMinute"], ["day", "rotDay"]].forEach(function (o) {
      var op = document.createElement("option"); op.value = o[0]; op.textContent = t(o[1]); sel.appendChild(op);
    });
    sel.value = state.rot;
  }
  $("setRot").addEventListener("change", function () { state.rot = this.value; save(); showPhrase(true); renderDaily(); });
  var curDay = iso(new Date());
  function checkNewDay() {
    var d = iso(new Date());
    if (d !== curDay) { curDay = d; render(); }
  }
  setInterval(function () {
    if (document.hidden) return;
    checkNewDay();
    if (state.rot === "minute" && state.start) { state.phraseIdx = (state.phraseIdx || 0) + 1; showPhrase(true); renderDaily(); }
  }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkNewDay(); });

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
  load();
  if (state.rot !== "day") { state.phraseIdx = (state.phraseIdx || 0) + 1; save(); }
  applyAppearance();
  loadMedia();
  applyLogo();
  applyLang();
  openSplash();
  lock();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refugio</title>
<meta name="theme-color" content="#111613">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Refugio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root {
  --bg: #e4e7df;
  --surface: #edefe8;
  --ink: #1d2620;
  --muted: #5b685f;
  --line: #ccd2c6;
  --green: #3d6350;
  --green-ink: #eef2ea;
  --sun: #a8793a;
  --sun-soft: #e3d5b6;
  --danger: #8f4b3d;
  --overlay: rgba(20, 26, 22, .6);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --ink: #dde3da; --muted: #8b998f; --line: #28332c;
    --green: #6b9780; --green-ink: #0e1511; --sun: #b38a52; --sun-soft: #2b2518; --danger: #c27c6c;
    --overlay: rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --ink: #dde3da; --muted: #8b998f; --line: #28332c;
  --green: #6b9780; --green-ink: #0e1511; --sun: #b38a52; --sun-soft: #2b2518; --danger: #c27c6c;
  --overlay: rgba(0, 0, 0, .7); color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
.app { max-width: 520px; margin: 0 auto; padding: 20px 18px 96px; }
header.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
header.top h1 { font-size: 26px; font-weight: 800; }
header.top p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.tools { display: flex; gap: 6px; flex-shrink: 0; }
.iconbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }

.hello { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; margin: 14px 0 0; text-align: center; }

.sunwrap { position: relative; margin: 6px auto 0; max-width: 360px; }
.sunwrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.track { stroke: var(--line); }
.prog { stroke: var(--sun); transition: stroke-dashoffset .9s ease; }
.sundot { fill: var(--sun); }
.sunglow { fill: var(--sun-soft); }
.count { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.count .n { font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 800; font-size: 76px; line-height: 1; }
.count .l { color: var(--muted); font-size: 16px; margin-top: 2px; }
.goalline { text-align: center; color: var(--muted); margin: 10px 0 0; font-size: 15px; }

.week { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); }
.dot.ok { background: var(--green); border-color: var(--green); }
.dot.fail { border-color: var(--danger); position: relative; }
.dot.fail::after { content: ""; position: absolute; inset: 6px 4px; border-top: 2px solid var(--danger); }

.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 18px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; }
.stat span { font-size: 13px; color: var(--muted); }

.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 16px; font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
.btn.primary { background: var(--green); color: var(--green-ink); }
.btn.sun { background: var(--sun); color: #16110a; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; font-size: 16px; padding: 12px; }
.btn + .btn { margin-top: 10px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.verse { margin: 22px 0 0; padding: 14px 16px; border-left: 4px solid var(--sun); background: var(--surface); border-radius: 0 12px 12px 0; }
.verse p { margin: 0; }
.verse small { display: block; color: var(--muted); margin-top: 6px; }
.verse button { background: none; border: 0; color: var(--green); font: inherit; font-size: 14px; padding: 8px 0 0; cursor: pointer; text-decoration: underline; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { display: flex; width: 100%; max-width: 520px; }
nav.tabs button { flex: 1; background: none; border: 0; padding: 14px 4px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-top-color: var(--sun); }

section.view { display: none; }
section.view.on { display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 20px; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
label.f { display: block; font-weight: 700; font-size: 15px; margin: 14px 0 6px; }
textarea, input[type=text], input[type=date], input[type=password], select { width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.row .btn { padding: 12px; font-size: 16px; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list li p { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
ul.list li time { display: block; font-size: 13px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
.empty { color: var(--muted); padding: 8px 0; }
.safe { display: flex; gap: 10px; align-items: flex-start; background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; }
.safe b { white-space: nowrap; }

.overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.on { display: flex; }
.overlay.lock { z-index: 40; align-items: center; background: var(--bg); }
.overlay.lock .sheet { border-radius: 22px; text-align: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 26px; margin-bottom: 6px; }
.breath { width: 150px; height: 150px; margin: 18px auto; border-radius: 50%; background: var(--sun-soft); border: 3px solid var(--sun); display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 700; animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.7); } 40% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } .prog { transition: none; } }
.timer { text-align: center; font-family: "Trebuchet MS", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 40px; font-weight: 800; }
.steps { margin: 14px 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }
.myreasons { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.myreasons p { margin: 0 0 6px; }
.myreasons p:last-child { margin: 0; }
.faithline { font-style: italic; }
.center { text-align: center; }
.small { font-size: 14px; color: var(--muted); }
.pin { text-align: center; letter-spacing: .5em; font-size: 28px; max-width: 220px; margin: 14px auto; display: block; }
.err { color: var(--danger); min-height: 1.4em; margin: 0; font-size: 15px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Refugio</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="tools">
      <button class="iconbtn" id="langBtn" type="button" aria-label="Cambiar idioma / Change language">English</button>
      <button class="iconbtn" id="themeBtn" type="button" data-i18n="theme" data-i18n-aria="themeAria"></button>
    </div>
  </header>

  <!-- HOY -->
  <section class="view on" id="v-hoy">
    <div id="welcome" class="card" hidden>
      <h2 data-i18n="wTitle"></h2>
      <p class="hint" data-i18n="wHint"></p>
      <div class="safe"><b data-i18n="wSafeB"></b><span data-i18n="wSafe"></span></div>

      <label class="f" for="nameIn" data-i18n="nameLbl"></label>
      <input type="text" id="nameIn" maxlength="30" autocomplete="off" data-i18n-ph="namePh">

      <label class="f" for="faithIn" data-i18n="faithLbl"></label>
      <select id="faithIn"></select>

      <label class="f" for="startDate" data-i18n="startLbl"></label>
      <input type="date" id="startDate">
      <p class="small" data-i18n="startNote"></p>

      <div class="row"><button class="btn primary" id="startBtn" type="button" data-i18n="startBtn"></button></div>
    </div>

    <div id="dash" hidden>
      <p class="hello" id="hello"></p>
      <div class="sunwrap">
        <svg viewBox="0 0 300 170" aria-hidden="true">
          <circle class="sunglow" id="glow" cx="150" cy="150" r="0" opacity=".7"/>
          <path class="track" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke-width="12" stroke-linecap="round"/>
          <path class="prog" id="prog" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke-width="12" stroke-linecap="round"/>
          <circle class="sundot" id="dot" cx="30" cy="150" r="13"/>
        </svg>
        <div class="count"><div class="n" id="days">0</div><div class="l" id="daysLbl"></div></div>
      </div>
      <p class="goalline" id="goalLine"></p>

      <div class="week" id="week"></div>

      <div class="stats">
        <div class="stat"><b id="best">0</b><span data-i18n="best"></span></div>
        <div class="stat"><b id="urges">0</b><span data-i18n="urges"></span></div>
        <div class="stat"><b id="relapses">0</b><span data-i18n="relapses"></span></div>
      </div>

      <button class="btn sun" id="urgeBtn" type="button" data-i18n="urgeBtn"></button>
      <button class="btn ghost" id="relapseBtn" type="button" data-i18n="relapseBtn"></button>

      <div class="verse">
        <p id="phraseText"></p>
        <small id="phraseRef"></small>
        <button type="button" id="phraseNext" data-i18n="phraseNext"></button>
      </div>
    </div>
  </section>

  <!-- RAZONES -->
  <section class="view" id="v-razones">
    <div class="card">
      <h2 data-i18n="reasonsT"></h2>
      <p class="hint" data-i18n="reasonsHint"></p>
      <textarea id="reasonIn" data-i18n-ph="reasonPh" data-i18n-aria="reasonAria"></textarea>
      <div class="row"><button class="btn primary" id="addReason" type="button" data-i18n="reasonSave"></button></div>
    </div>
    <div class="card"><ul class="list" id="reasonList"></ul></div>
  </section>

  <!-- DIARIO -->
  <section class="view" id="v-diario">
    <div class="card">
      <h2 data-i18n="diaryT"></h2>
      <p class="hint" data-i18n="diaryHint"></p>
      <textarea id="noteIn" data-i18n-ph="notePh" data-i18n-aria="noteAria"></textarea>
      <div class="row"><button class="btn primary" id="addNote" type="button" data-i18n="noteSave"></button></div>
    </div>
    <div class="card"><ul class="list" id="noteList"></ul></div>
  </section>

  <!-- PLAN -->
  <section class="view" id="v-plan">
    <div class="card">
      <h2 data-i18n="planT"></h2>
      <p class="hint" data-i18n="planHint"></p>
      <ul class="steps">
        <li><b data-i18n="plan1b"></b> <span data-i18n="plan1"></span></li>
        <li><b data-i18n="plan2b"></b> <span data-i18n="plan2"></span></li>
        <li><b data-i18n="plan3b"></b> <span data-i18n="plan3"></span></li>
        <li><b data-i18n="plan4b"></b> <span data-i18n="plan4"></span></li>
        <li><b data-i18n="plan5b"></b> <span id="supportTxt"></span></li>
        <li><b data-i18n="plan6b"></b> <span data-i18n="plan6"></span></li>
      </ul>
      <p class="small" data-i18n="planHelp"></p>
    </div>

    <div class="card">
      <h2 data-i18n="setT"></h2>
      <label class="f" for="setName" data-i18n="setNameLbl"></label>
      <input type="text" id="setName" maxlength="30" autocomplete="off">
      <label class="f" for="setFaith" data-i18n="setFaithLbl"></label>
      <select id="setFaith"></select>
      <div class="row"><button class="btn primary" id="saveSet" type="button" data-i18n="setSave"></button></div>
      <p class="small" id="setMsg" role="status"></p>
    </div>

    <div class="card">
      <h2 data-i18n="pinT"></h2>
      <p class="hint" data-i18n="pinHint"></p>
      <input type="password" id="pinSet" inputmode="numeric" maxlength="4" class="pin" placeholder="••••" data-i18n-aria="pinAria">
      <div class="row">
        <button class="btn primary" id="pinSave" type="button"></button>
        <button class="btn ghost" id="pinOff" type="button" data-i18n="pinOff"></button>
      </div>
      <p class="small" id="pinMsg" role="status"></p>
    </div>

    <div class="card">
      <h2 data-i18n="dataT"></h2>
      <p class="hint" data-i18n="dataHint"></p>
      <button class="btn ghost" id="wipeBtn" type="button" data-i18n="wipeBtn"></button>
    </div>
  </section>
</div>

<nav class="tabs" data-i18n-aria="tabsAria">
  <div class="in" role="tablist">
    <button role="tab" aria-selected="true" data-v="hoy" type="button" data-i18n="tabHoy"></button>
    <button role="tab" aria-selected="false" data-v="razones" type="button" data-i18n="tabReasons"></button>
    <button role="tab" aria-selected="false" data-v="diario" type="button" data-i18n="tabDiary"></button>
    <button role="tab" aria-selected="false" data-v="plan" type="button" data-i18n="tabPlan"></button>
  </div>
</nav>

<!-- MOMENTO DIFÍCIL -->
<div class="overlay" id="urgeOv" role="dialog" aria-modal="true" aria-labelledby="urgeTitle">
  <div class="sheet">
    <h2 id="urgeTitle"></h2>
    <p class="hint" data-i18n="urgeHint"></p>
    <div class="timer" id="timer">10:00</div>
    <div class="breath" aria-hidden="true" data-i18n="breathe"></div>
    <p class="center small" data-i18n="breatheNote"></p>
    <ol class="steps">
      <li data-i18n="urge1"></li>
      <li data-i18n="urge2"></li>
      <li data-i18n="urge3"></li>
      <li id="urgeAct"></li>
    </ol>
    <div class="myreasons" id="urgeFaith"></div>
    <div class="myreasons" id="urgeReasons"></div>
    <button class="btn primary" id="urgeDone" type="button" data-i18n="urgeDone"></button>
    <button class="btn ghost" id="urgeClose" type="button" data-i18n="urgeClose"></button>
  </div>
</div>

<!-- CONFIRMAR -->
<div class="overlay" id="confOv" role="dialog" aria-modal="true" aria-labelledby="confTitle">
  <div class="sheet">
    <h2 id="confTitle"></h2>
    <p id="confText" class="hint"></p>
    <button class="btn primary" id="confYes" type="button"></button>
    <button class="btn ghost" id="confNo" type="button" data-i18n="confNo"></button>
  </div>
</div>

<!-- ÁNIMO TRAS UN TROPIEZO -->
<div class="overlay" id="cheerOv" role="dialog" aria-modal="true" aria-labelledby="cheerTitle">
  <div class="sheet">
    <h2 id="cheerTitle"></h2>
    <p id="cheerMsg" class="hint" style="font-size:18px;color:var(--ink)"></p>
    <div class="myreasons" id="cheerVerse"></div>
    <p class="small" id="cheerBest"></p>
    <button class="btn primary" id="cheerGo" type="button" data-i18n="cheerGo"></button>
    <button class="btn ghost" id="cheerDiary" type="button" data-i18n="cheerDiary"></button>
  </div>
</div>

<!-- BLOQUEO -->
<div class="overlay lock" id="lockOv" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="sheet">
    <h2 id="lockTitle">Refugio</h2>
    <p class="hint" data-i18n="lockHint"></p>
    <input type="password" id="lockIn" inputmode="numeric" maxlength="4" class="pin" placeholder="••••" data-i18n-aria="pinAria">
    <p class="err" id="lockErr" role="alert"></p>
    <button class="btn primary" id="lockGo" type="button" data-i18n="lockEnter"></button>
    <button class="btn ghost" id="lockForgot" type="button" data-i18n="lockForgot"></button>
  </div>
</div>

    } catch (e) {}
    if (!FAITHS[state.faith]) state.faith = "cristiana";
    if (state.theme !== "light" && state.theme !== "dark") state.theme = "dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    if (state.lang !== "es" && state.lang !== "en") {
      var nav = (navigator.language || "es").toLowerCase();
      state.lang = nav.indexOf("es") === 0 ? "es" : "en";
    }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function hashPin(p) { var x = 5381, s = SALT + p; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return String(x >>> 0); }

  function $(id) { return document.getElementById(id); }
  function t(key, vars) {
    var s = (L[state.lang] && L[state.lang][key]);
    if (s === undefined) s = L.es[key] || key;
    if (typeof s === "string" && vars) { for (var k in vars) s = s.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]); }
    return s;
  }
  function nm() { return (state.name || "").trim(); }
  function withName(txt) {
    return nm() ? txt.replace(/\{n\}/g, nm()) : txt.replace(/, \{n\}/g, "").replace(/ \{n\}/g, "").replace(/\{n\}/g, "");
  }

  function iso(d) { var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day; }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function daysBetween(a, b) { return Math.round((parse(iso(b)) - parse(iso(a))) / 864e5); }
  function streak() { return state.start ? Math.max(0, daysBetween(parse(state.start), new Date())) : 0; }
  function fmtDate(s) { try { return new Date(s).toLocaleDateString(t("locale"), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return s; } }

  /* ---------- aplicar idioma ---------- */
  function fillFaith(sel, value) {
    sel.innerHTML = "";
    FAITH_ORDER.forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = FAITHS[k].label[state.lang]; sel.appendChild(o); });
    sel.value = value;
  }
  function applyStatic() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    $("langBtn").textContent = t("langBtn");
    $("week").setAttribute("aria-label", t("weekAria"));
  }
  function applyLang() {
    applyStatic();
    fillFaith($("faithIn"), $("faithIn").value || state.faith);
    fillFaith($("setFaith"), state.faith);
    render(); renderReasons(); renderNotes(); syncSettings();
  }

  /* ---------- frases ---------- */
  function showPhrase() {
    var list = FAITHS[state.faith].phrases;
    var i = ((state.phraseIdx % list.length) + list.length) % list.length;
    var p = list[i][state.lang];
    $("phraseText").textContent = withName(p[0]);
    $("phraseRef").textContent = p[1];
    $("phraseRef").style.display = p[1] ? "block" : "none";
  }

  /* ---------- Hoy ---------- */
  function greeting() {
    var h = new Date().getHours();
    var g = h < 12 ? t("morning") : (h < 19 ? t("afternoon") : t("night"));
    return nm() ? g + ", " + nm() : g;
  }
  function render() {
    var has = !!state.start;
    $("welcome").hidden = has;
    $("dash").hidden = !has;
    $("supportTxt").textContent = FAITHS[state.faith].support[state.lang];
    if (!has) { $("startDate").value = $("startDate").value || iso(new Date()); $("startDate").max = iso(new Date()); return; }

    $("hello").textContent = greeting();
    var n = streak();
    if (n > state.best) { state.best = n; save(); }
    $("days").textContent = n;
    $("daysLbl").textContent = n === 1 ? t("dayOne") : t("dayMany");
    $("best").textContent = state.best;
    $("urges").textContent = state.urges;
    $("relapses").textContent = state.relapses.length;

    var goal = MILESTONES[MILESTONES.length - 1];
    for (var i = 0; i < MILESTONES.length; i++) { if (MILESTONES[i] > n) { goal = MILESTONES[i]; break; } }
    var frac = Math.min(1, n / goal);
    var prog = $("prog"), len = prog.getTotalLength();
    prog.style.strokeDasharray = len;
    prog.style.strokeDashoffset = len * (1 - frac);
    var ang = Math.PI * (1 - frac);
    var cx = 150 + 120 * Math.cos(ang), cy = 150 - 120 * Math.sin(ang);
    $("dot").setAttribute("cx", cx); $("dot").setAttribute("cy", cy);
    $("glow").setAttribute("cx", cx); $("glow").setAttribute("cy", cy);
    $("glow").setAttribute("r", 18 + frac * 14);
    $("goalLine").textContent = n >= goal ? t("goalReached", { g: goal }) : t("goalNext", { g: goal, left: goal - n });

    var wk = $("week"); wk.innerHTML = "";
    var names = t("weekDays");
    for (var d = 6; d >= 0; d--) {
      var dt = new Date(); dt.setDate(dt.getDate() - d);
      var key = iso(dt), cls = "dot";
      if (state.relapses.indexOf(key) !== -1) cls += " fail"; else if (key >= state.start) cls += " ok";
      var cell = document.createElement("div"); cell.className = "day";
      var dot = document.createElement("div"); dot.className = cls;
      var lb = document.createElement("span"); lb.textContent = names[dt.getDay()];
      cell.appendChild(dot); cell.appendChild(lb); wk.appendChild(cell);
    }
    showPhrase();
  }

  /* ---------- listas ---------- */
  function renderList(ul, items, emptyMsg, withDate, onDel) {
    ul.innerHTML = "";
    if (!items.length) { var e = document.createElement("li"); var ep = document.createElement("p"); ep.className = "empty"; ep.textContent = emptyMsg; e.appendChild(ep); ul.appendChild(e); return; }
    items.forEach(function (it, idx) {
      var li = document.createElement("li");
      var p = document.createElement("p");
      if (withDate) { var tm = document.createElement("time"); tm.textContent = fmtDate(it.d); p.appendChild(tm); }
      p.appendChild(document.createTextNode(withDate ? it.t : it));
      var x = document.createElement("button"); x.className = "x"; x.type = "button"; x.setAttribute("aria-label", t("delAria")); x.textContent = "×";
      x.addEventListener("click", function () { onDel(idx); });
      li.appendChild(p); li.appendChild(x); ul.appendChild(li);
    });
  }
  function renderReasons() { renderList($("reasonList"), state.reasons, t("reasonEmpty"), false, function (i) { state.reasons.splice(i, 1); save(); renderReasons(); }); }
  function renderNotes() { renderList($("noteList"), state.notes, t("noteEmpty"), true, function (i) { state.notes.splice(i, 1); save(); renderNotes(); }); }

  $("addReason").addEventListener("click", function () { var v = $("reasonIn").value.trim(); if (!v) return; state.reasons.unshift(v); $("reasonIn").value = ""; save(); renderReasons(); });
  $("addNote").addEventListener("click", function () { var v = $("noteIn").value.trim(); if (!v) return; state.notes.unshift({ d: new Date().toISOString(), t: v }); $("noteIn").value = ""; save(); renderNotes(); });

  /* ---------- navegación ---------- */
  var tabs = document.querySelectorAll("nav.tabs button");
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      tabs.forEach(function (o) { o.setAttribute("aria-selected", o === b ? "true" : "false"); });
      document.querySelectorAll("section.view").forEach(function (s) { s.classList.remove("on"); });
      $("v-" + b.dataset.v).classList.add("on");
      window.scrollTo(0, 0);
    });
  });

  /* ---------- inicio ---------- */
  $("startBtn").addEventListener("click", function () {
    var v = $("startDate").value || iso(new Date());
    if (v > iso(new Date())) v = iso(new Date());
    state.name = $("nameIn").value.trim();
    state.faith = $("faithIn").value;
    state.start = v; state.phraseIdx = new Date().getDate(); save();
    render(); syncSettings(); fillFaith($("setFaith"), state.faith);
  });
  $("phraseNext").addEventListener("click", function () { state.phraseIdx += 1; save(); showPhrase(); });

  /* ---------- idioma ---------- */
  $("langBtn").addEventListener("click", function () {
    state.lang = state.lang === "es" ? "en" : "es"; save(); applyLang();
    if ($("urgeOv").classList.contains("on")) openUrge(true);
  });

  /* ---------- ánimo tras un tropiezo ---------- */
  function showCheer() {
    $("cheerTitle").textContent = nm() ? t("cheerTitleN", { n: nm() }) : t("cheerTitle");
    var msgs = t("cheerMsgs");
    $("cheerMsg").textContent = msgs[Math.floor(Math.random() * msgs.length)];
    var vb = $("cheerVerse"); vb.innerHTML = "";
    var list = FAITHS[state.faith].phrases;
    var p = list[Math.floor(Math.random() * list.length)][state.lang];
    var vp = document.createElement("p"); vp.className = "faithline"; vp.textContent = withName(p[0]); vb.appendChild(vp);
    if (p[1]) { var rp = document.createElement("p"); rp.className = "small"; rp.textContent = p[1]; vb.appendChild(rp); }
    $("cheerBest").textContent = state.best > 0 ? t("cheerBest", { b: state.best }) : "";
    $("cheerOv").classList.add("on");
  }
  $("cheerGo").addEventListener("click", function () { $("cheerOv").classList.remove("on"); window.scrollTo(0, 0); });
  $("cheerDiary").addEventListener("click", function () {
    $("cheerOv").classList.remove("on");
    var tab = document.querySelector('nav.tabs button[data-v="diario"]'); if (tab) tab.click();
    setTimeout(function () { $("noteIn").focus(); }, 50);
  });

  /* ---------- confirmación ---------- */
  var confCb = null;
  function confirmBox(title, text, yes, cb) { $("confTitle").textContent = title; $("confText").textContent = text; $("confYes").textContent = yes; confCb = cb; $("confOv").classList.add("on"); }
  $("confYes").addEventListener("click", function () { $("confOv").classList.remove("on"); var cb = confCb; confCb = null; if (cb) cb(); });
  $("confNo").addEventListener("click", function () { $("confOv").classList.remove("on"); confCb = null; });

  $("relapseBtn").addEventListener("click", function () {
    confirmBox(
      nm() ? t("relTN", { n: nm() }) : t("relT"),
      t("relTxt"), t("relYes"),
      function () { var n0 = streak(); if (n0 > state.best) state.best = n0; var d = iso(new Date()); if (state.relapses.indexOf(d) === -1) state.relapses.push(d); state.start = d; save(); render(); showCheer(); }
    );
  });

  function wipe() {
    var keepLang = state.lang, keepTheme = state.theme;
    state = { start: null, best: 0, relapses: [], urges: 0, reasons: [], notes: [], name: "", faith: "cristiana", pin: "", phraseIdx: 0, lang: keepLang, theme: keepTheme };
    try { localStorage.removeItem(KEY); localStorage.removeItem(OLD); } catch (e) {}
    save(); $("nameIn").value = "";
    applyLang();
  }
  $("wipeBtn").addEventListener("click", function () { confirmBox(t("wipeT"), t("wipeTxt"), t("wipeYes"), wipe); });

  /* ---------- momento difícil ---------- */
  var timerId = null, remaining = 600;
  function paintTimer() { var m = Math.floor(remaining / 60), s = remaining % 60; $("timer").textContent = m + ":" + (s < 10 ? "0" : "") + s; }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function openUrge(keepTimer) {
    $("urgeTitle").textContent = nm() ? t("urgeTitleN", { n: nm() }) : t("urgeTitle");
    $("urgeAct").textContent = FAITHS[state.faith].act[state.lang];

    var fb = $("urgeFaith"); fb.innerHTML = "";
    var list = FAITHS[state.faith].phrases;
    var p = list[Math.floor(Math.random() * list.length)][state.lang];
    var fp = document.createElement("p"); fp.className = "faithline"; fp.textContent = withName(p[0]); fb.appendChild(fp);
    if (p[1]) { var rp = document.createElement("p"); rp.className = "small"; rp.textContent = p[1]; fb.appendChild(rp); }

    var box = $("urgeReasons"); box.innerHTML = "";
    if (state.reasons.length) {
      var h = document.createElement("p"); var b = document.createElement("b"); b.textContent = t("remindWhy"); h.appendChild(b); box.appendChild(h);
      state.reasons.slice(0, 3).forEach(function (r) { var q = document.createElement("p"); q.textContent = "• " + r; box.appendChild(q); });
    } else {
      var p0 = document.createElement("p"); p0.textContent = t("remindNone"); box.appendChild(p0);
    }
    if (keepTimer !== true) {
      remaining = 600; paintTimer(); stopTimer();
      timerId = setInterval(function () { remaining -= 1; if (remaining <= 0) { remaining = 0; stopTimer(); } paintTimer(); }, 1000);
    }
    $("urgeOv").classList.add("on");
  }
  function closeUrge() { stopTimer(); $("urgeOv").classList.remove("on"); }
  $("urgeBtn").addEventListener("click", function () { openUrge(); });
  $("urgeClose").addEventListener("click", closeUrge);
  $("urgeDone").addEventListener("click", function () { state.urges += 1; save(); closeUrge(); render(); });

  /* ---------- ajustes ---------- */
  function syncSettings() {
    $("setName").value = state.name || "";
    $("setFaith").value = state.faith;
    $("pinOff").style.display = state.pin ? "block" : "none";
    $("pinSave").textContent = state.pin ? t("pinChange") : t("pinOn");
  }
  $("saveSet").addEventListener("click", function () {
    state.name = $("setName").value.trim();
    state.faith = $("setFaith").value;
    state.phraseIdx = 0; save(); render(); syncSettings();
    $("setMsg").textContent = t("setSaved");
    setTimeout(function () { $("setMsg").textContent = ""; }, 2500);
  });
  $("pinSave").addEventListener("click", function () {
    var v = $("pinSet").value;
    if (!/^\d{4}$/.test(v)) { $("pinMsg").textContent = t("pinBad"); return; }
    state.pin = hashPin(v); save(); $("pinSet").value = "";
    $("pinMsg").textContent = t("pinSaved"); syncSettings();
  });
  $("pinOff").addEventListener("click", function () {
    state.pin = ""; save(); $("pinMsg").textContent = t("pinRemoved"); syncSettings();
  });

  /* ---------- bloqueo ---------- */
  function lock() { if (!state.pin) return; $("lockIn").value = ""; $("lockErr").textContent = ""; $("lockOv").classList.add("on"); }
  function tryUnlock() {
    if (hashPin($("lockIn").value) === state.pin) { $("lockOv").classList.remove("on"); $("lockIn").value = ""; $("lockErr").textContent = ""; }
    else { $("lockErr").textContent = t("lockErr"); $("lockIn").value = ""; }
  }
  $("lockGo").addEventListener("click", tryUnlock);
  $("lockIn").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  $("lockForgot").addEventListener("click", function () {
    confirmBox(t("forgotT"), t("forgotTxt"), t("forgotYes"), function () { $("lockOv").classList.remove("on"); wipe(); });
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) lock(); });

  /* ---------- tema ---------- */
  $("themeBtn").addEventListener("click", function () {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    save();
  });

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
  load();
  applyLang();
  lock();
})();
</script>
</body>
</html>
